# BLE observer (scan for the beacon) + peripheral (advertise the result
# service) at the same time.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="rssi_classifier"
CONFIG_BT_SETTINGS=n

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_GPIO=y

CONFIG_MAIN_STACK_SIZE=2048

# The classifier (src/inference.c) uses sqrtf/lroundf from libm.
CONFIG_FPU=y
