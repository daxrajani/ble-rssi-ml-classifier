# BLE observer (scan for the beacon) + peripheral (advertise the result
# service) at the same time.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="rssi_classifier"
CONFIG_BT_SETTINGS=n

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_GPIO=y

# Give threads/heap room for a TFLite Micro interpreter or the Edge
# Impulse SDK once it's linked in. Tune down once you know the model's
# real footprint (see results/accuracy_report.md).
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Uncomment when building with TFLite Micro / CMSIS-NN directly instead of
# an Edge Impulse export:
# CONFIG_CPLUSPLUS=y
# CONFIG_STD_CPP17=y
# CONFIG_NEWLIB_LIBC=y
