# BLE observer/scanner role only - no GATT client/server needed.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="rssi_scanner"

# UART console output (goes over the DK's onboard VCOM/USB-UART).
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# We just need current uptime for timestamps.
CONFIG_SYS_CLOCK_EXISTS=y

# Keep the image small and boot fast - no shell needed for this app.
CONFIG_BT_SETTINGS=n
